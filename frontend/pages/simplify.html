<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" href="../icons/favicon.jpeg" />
  <title>Simplify — ClearClause</title>
  <meta name="description" content="Paste a Sri Lankan statute provision and get a simplified plain-English version with source traceability." />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/custom.css" />

  <!-- Tailwind config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              'Inter', 'ui-sans-serif', 'system-ui', '-apple-system',
              'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue',
              'Arial', 'Noto Sans', 'sans-serif'
            ],
            serif: [
              'Fraunces', 'ui-serif', 'Georgia', 'Cambria', 'Times New Roman', 'serif'
            ],
          },
        },
      },
    };
  </script>

  <!-- Google Fonts — Inter (body) + Fraunces (headings) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
</head>

<body class="bg-stone-50 text-stone-700 font-sans antialiased min-h-screen flex flex-col">

  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- ===== Navbar ===== -->
  <div id="navbar-container"></div>

  <!-- ===== Disclaimer ===== -->
  <div id="disclaimer-container" class="max-w-3xl mx-auto w-full px-4 sm:px-6 lg:px-8 mt-3"></div>

  <!-- ===== Main Content ===== -->
  <main id="main-content" class="flex-1 max-w-3xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10 md:py-14">

    <!-- Page heading -->
    <div class="fade-in-up text-center mb-8">
      <h1 class="font-serif text-3xl sm:text-4xl font-semibold text-stone-900 tracking-tight text-balance">
        Simplify a Sri Lankan statute provision
      </h1>
      <p class="mt-2 text-sm text-stone-500 max-w-lg mx-auto leading-relaxed">
        Paste a legal provision below and get a plain-English rewrite with every claim linked back to its source.
      </p>
    </div>

    <!-- Live region for a11y status announcements -->
    <div id="status-live" class="sr-only" aria-live="polite" role="status"></div>

    <!-- ===== Input Panel ===== -->
    <div id="input-panel" class="fade-in-up" data-delay="1">
      <form id="simplify-form" novalidate>
        <div class="bg-white rounded-xl border border-stone-200 shadow-sm p-5 sm:p-6">
          <label for="statute-input" class="block text-sm font-medium text-stone-700 mb-2">
            Paste a Sri Lankan statute provision here
          </label>
          <textarea
            id="statute-input"
            name="statute-input"
            rows="6"
            class="w-full rounded-lg border border-stone-300 bg-stone-50 px-4 py-3 text-sm text-stone-700 placeholder-stone-400 resize-y transition-colors duration-150 focus:bg-white"
            placeholder="Example: Whoever commits murder shall be punished with death..."
            aria-describedby="validation-msg"
          ></textarea>

          <!-- Validation message -->
          <p id="validation-msg" class="hidden mt-2 text-sm text-red-600" role="alert" aria-live="assertive"></p>

          <div class="mt-4 flex justify-end">
            <button
              id="simplify-btn"
              type="submit"
              class="btn-lift inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-indigo-700 text-white text-sm font-semibold shadow-sm hover:bg-indigo-800 transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2"
            >
              <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 0 0-2.455 2.456Z" /></svg>
              Simplify
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- ===== Loading Panel ===== -->
    <div id="loading-panel" class="hidden fade-in mt-6">
      <div class="bg-white rounded-xl border border-stone-200 shadow-sm p-8 text-center">
        <div class="cc-dots mx-auto mb-4">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <p id="loading-text" class="text-sm font-medium text-stone-700">Simplifying provision…</p>
        <p class="mt-1 text-xs text-stone-400">Processing via the ClearClause backend.</p>
      </div>
    </div>

    <!-- ===== Results Panel ===== -->
    <div id="results-panel" class="hidden mt-6">
      <!-- Populated dynamically by app.js -->
    </div>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="py-4 text-center text-xs text-stone-400 border-t border-stone-100">
    &copy; 2026 ClearClause
  </footer>

  <!-- ===== Scripts ===== -->
  <script>
    window.CLEARCLAUSE_BASE_PATH = "..";
  </script>

  <script src="../js/app.js?v=2"></script>
</body>
</html>
